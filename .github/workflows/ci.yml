# ============================================================
# HelioPulse — GitHub Actions CI Pipeline
# Runs on every push & PR to main / develop
# Jobs: backend-tests, frontend-build, docker-build-check
# ============================================================

name: HelioPulse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── 1. Backend: Python + pytest ──────────────────────────
  backend-tests:
    name: Backend Tests (Python ${{ env.PYTHON_VERSION }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create snapshots directory
        run: mkdir -p snapshots

      - name: Run pytest (22 tests expected)
        run: pytest -v --tb=short --color=yes

      - name: Upload snapshot artifacts (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-snapshots
          path: snapshots/
          retention-days: 3

  # ── 2. Frontend: TypeScript + Next.js build ──────────────
  frontend-build:
    name: Frontend Build (Node ${{ env.NODE_VERSION }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --frozen-lockfile

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Next.js production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Upload .next build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}

  # ── 3. Docker Compose smoke test ─────────────────────────
  docker-compose-check:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet

      - name: Check Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3009

      - name: Check Frontend Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          ignore: DL3008,DL3016,SC2015

